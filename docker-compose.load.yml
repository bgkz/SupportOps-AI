services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: loadtest
      POSTGRES_PASSWORD: loadtest
      POSTGRES_DB: supportops_loadtest
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - loadtest_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  loadtest_postgres:
