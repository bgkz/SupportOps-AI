name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: backend

    env:
      BACKEND_API_KEY: "ci-test-api-key"
      DATABASE_URL: "sqlite:///:memory:"
      TEST_DATABASE_URL: "postgresql+psycopg://ci_user:ci_password@localhost:5432/supportops_test"

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: supportops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d supportops_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Repository herunterladen
        uses: actions/checkout@v7

      - name: Python einrichten
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Abhängigkeiten installieren
        run: python -m pip install -r requirements.txt

      - name: Backend-Tests ausführen
        working-directory: .
        run: python -m pytest backend/tests -q
